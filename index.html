/* ---------- Stockage local (remplace le stockage Claude par localStorage) ---------- */

const storage = {
  get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }
  },
};

/* ---------- Utilitaires de temps ---------- */

// Nettoie systématiquement un champ texte libre saisi par l'utilisateur avant
// stockage/diffusion : retire les caractères de contrôle invisibles, les
// espaces superflus, et limite la longueur pour éviter tout abus (notamment
// pour les champs diffusés à tous les utilisateurs, comme la bannière pub).
function nettoyerTexte(valeur, longueurMax) {
  if (typeof valeur !== "string") return "";
  const sansControle = valeur.replace(/[\u0000-\u001F\u007F]/g, "");
  const reduit = sansControle.trim().replace(/\s{2,}/g, " ");
  return longueurMax ? reduit.slice(0, longueurMax) : reduit;
}

// Valide qu'une URL saisie par l'utilisateur est bien une adresse web (http/https)
// avant de l'accepter — sinon renvoie une chaîne vide (le champ est "effacé").
function validerURL(valeur) {
  const v = nettoyerTexte(valeur, 500);
  if (!v) return "";
  try {
    const url = new URL(v);
    return (url.protocol === "http:" || url.protocol === "https:") ? v : "";
  } catch (e) {
    return "";
  }
}

function nowLocalISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}

function todayISODate() {
  return nowLocalISO().slice(0, 10);
}

function minutesBetween(a, b) {
  if (!a || !b) return 0;
  const diff = (new Date(b) - new Date(a)) / 60000;
  return diff > 0 ? diff : 0;
}

function fmtHM(totalMinutes) {
  const m = Math.round(totalMinutes || 0);
  const sign = m < 0 ? "-" : "";
  const abs = Math.abs(m);
  const h = Math.floor(abs / 60);
  const mm = abs % 60;
  return `${sign}${h}h${String(mm).padStart(2, "0")}`;
}

function minutesToHours(m) {
  return (m || 0) / 60;
}

// Extrait l'heure "HH:MM" d'une chaîne datetime-local (évite les soucis de fuseau horaire)
function fmtHeure(iso) {
  if (!iso) return "--:--";
  return iso.slice(11, 16);
}

// Découpe la période de service en segments de travail, en excluant les pauses,
// pour visualiser précisément à quelle heure chaque portion de temps de service se termine.
function computeSegments(entry, liveNow) {
  if (!entry.debutService) return [];
  const finEffective = entry.finService || liveNow || "";
  if (!finEffective) return [];

  const pauses = entry.pauses
    .filter((p) => p.debut)
    .slice()
    .sort((a, b) => a.debut.localeCompare(b.debut));

  const segments = [];
  let cursor = entry.debutService;

  for (const p of pauses) {
    if (p.debut > cursor) {
      segments.push({ debut: cursor, fin: p.debut, enCours: false });
    }
    if (!p.fin) {
      // Pause en cours : le service est actuellement suspendu, pas de nouveau segment
      return segments;
    }
    cursor = p.fin > cursor ? p.fin : cursor;
  }

  if (cursor < finEffective) {
    segments.push({ debut: cursor, fin: finEffective, enCours: !entry.finService });
  }
  return segments;
}

// Calcule la fin impérative de l'amplitude ET du temps de service, selon l'heure de
// début : départ en journée (05h-21h par défaut) → amplitude 15h / service max 12h,
// départ de nuit (21h-05h) → amplitude 13h / service max 10h. Tout modifiable en Réglages.
// - Fin d'amplitude = début + amplitude max (15h/13h)
// - Fin de service (affichée) = fin d'amplitude - pauses réellement prises
// - Temps de service restant = calculé sur le plafond dédié (12h/10h), jamais dépassable
function computeModeRoutier(entry, rates, liveNow, serviceMin, pauseMin) {
  if (!rates.activerModeRoutier || !entry.debutService) return null;

  const heureDebut = entry.debutService.slice(11, 16);
  const enJournee = heureDebut >= rates.routierHeureJourDebut && heureDebut < rates.routierHeureJourFin;
  const amplitudeMaxH = enJournee ? rates.routierAmplitudeJour : rates.routierAmplitudeNuit;
  const serviceMaxH = enJournee ? rates.routierServiceJour : rates.routierServiceNuit;

  const debutDate = new Date(entry.debutService);
  const finImperativeDate = new Date(debutDate.getTime() + amplitudeMaxH * 3600000);
  const finImperativeHHMM = String(finImperativeDate.getHours()).padStart(2, "0") + ":" + String(finImperativeDate.getMinutes()).padStart(2, "0");

  // Fin de service = fin d'amplitude moins les pauses réellement prises jusqu'ici
  const finServiceDate = new Date(finImperativeDate.getTime() - (pauseMin || 0) * 60000);
  const finServiceHHMM = String(finServiceDate.getHours()).padStart(2, "0") + ":" + String(finServiceDate.getMinutes()).padStart(2, "0");

  const now = new Date(liveNow);
  const tempsRestantAmplitudeMin = (finImperativeDate - now) / 60000;
  const tempsServiceRestantMin = serviceMaxH * 60 - serviceMin; // basé sur le plafond dédié, pas l'amplitude

  const niveau = (minutesRestantes) => {
    if (minutesRestantes <= 5) return "critique";
    if (minutesRestantes <= rates.alerteMinutes) return "alerte";
    return "ok";
  };

  return {
    enJournee, amplitudeMaxH, serviceMaxH, finImperativeHHMM, finServiceHHMM, tempsRestantAmplitudeMin, tempsServiceRestantMin,
    niveauAmplitude: niveau(tempsRestantAmplitudeMin),
    niveauService: niveau(tempsServiceRestantMin),
  };
}


// chevauchement d'un intervalle [start,end] avec les plages de nuit (21h-6h)
function nightOverlapMinutes(startStr, endStr) {
  if (!startStr || !endStr) return 0;
  const start = new Date(startStr);
  const end = new Date(endStr);
  if (end <= start) return 0;

  let total = 0;
  let cursor = new Date(start);
  cursor.setDate(cursor.getDate() - 1);
  cursor.setHours(0, 0, 0, 0);

  const lastDay = new Date(end);
  lastDay.setHours(0, 0, 0, 0);

  while (cursor <= lastDay) {
    const nightStart = new Date(cursor);
    nightStart.setHours(21, 0, 0, 0);
    const nightEnd = new Date(cursor);
    nightEnd.setDate(nightEnd.getDate() + 1);
    nightEnd.setHours(6, 0, 0, 0);

    const os = new Date(Math.max(start.getTime(), nightStart.getTime()));
    const oe = new Date(Math.min(end.getTime(), nightEnd.getTime()));
    if (oe > os) total += (oe - os) / 60000;

    cursor.setDate(cursor.getDate() + 1);
  }
  return total;
}

/* ---------- Calculs d'une journée ---------- */

function computeEntry(entry, rates, liveNow) {
  const enCoursService = !!(entry.debutService && !entry.finService);
  const finEffective = entry.finService || (enCoursService && liveNow ? liveNow : "");
  const amplitudeMin = minutesBetween(entry.debutService, finEffective);

  const pausesCompletes = entry.pauses.filter((p) => p.debut && p.fin);
  const pauseEnCours = entry.pauses.find((p) => p.debut && !p.fin);
  let pauseCalcMin = pausesCompletes.reduce(
    (s, p) => s + minutesBetween(p.debut, p.fin), 0
  );
  if (pauseEnCours && liveNow) pauseCalcMin += minutesBetween(pauseEnCours.debut, liveNow);

  const pauseManuelleNum =
    entry.pauseManuelle !== "" && entry.pauseManuelle !== null && entry.pauseManuelle !== undefined
      ? Number(entry.pauseManuelle)
      : null;
  const pauseMin = pauseManuelleNum !== null && !isNaN(pauseManuelleNum) ? pauseManuelleNum : pauseCalcMin;

  const serviceMin = Math.max(0, amplitudeMin - pauseMin);

  const nightGrossMin = nightOverlapMinutes(entry.debutService, finEffective);
  let nightPauseMin = pausesCompletes.reduce(
    (s, p) => s + nightOverlapMinutes(p.debut, p.fin), 0
  );
  if (pauseEnCours && liveNow) nightPauseMin += nightOverlapMinutes(pauseEnCours.debut, liveNow);
  const nightWorkedMin = Math.max(0, nightGrossMin - nightPauseMin);

  // Frais de route du jour
  let frais = 0;
  if (entry.casseCroute.actif) frais += entry.casseCroute.etranger ? rates.casseCrouteEtr : rates.casseCroute;
  if (entry.repasMidi.actif) frais += entry.repasMidi.etranger ? rates.repasEtr : rates.repas;
  if (entry.repasSoir.actif) frais += entry.repasSoir.etranger ? rates.repasEtr : rates.repas;
  if (entry.decouche.actif) frais += entry.decouche.etranger ? rates.decoucheEtr : rates.decouche;
  if (entry.weekend.actif) frais += Number(entry.weekend.montant) || 0;
  frais += Number(entry.peage) || 0;
  frais += Number(entry.parking) || 0;
  frais += Number(entry.hotel) || 0;

  return {
    enCoursService,
    pauseEnCours: !!pauseEnCours,
    finEffective,
    segments: computeSegments(entry, liveNow),
    amplitudeMin,
    pauseMin,
    pauseCalcMin,
    serviceMin,
    nightWorkedMin,
    frais,
  };
}

/* ---------- Regroupement mensuel & paie ---------- */

function computeMonthPay(entriesForMonth, rates, liveNow, primesDuMois) {
  let serviceMin = 0, nightMin = 0, frais = 0;
  entriesForMonth.forEach((e) => {
    const c = computeEntry(e, rates, liveNow);
    serviceMin += c.serviceMin;
    nightMin += c.nightWorkedMin;
    frais += c.frais;
  });

  const H = minutesToHours(serviceMin);
  const nightH = minutesToHours(nightMin);

  // Cascade : si un palier est désactivé, ses heures gardent le taux du palier actif précédent
  const tauxHS25 = rates.activerHS25 ? 1.25 : 1.0;
  const tauxHS50 = rates.activerHS50 ? 1.5 : tauxHS25;
  const tauxHS100 = rates.activerHS100 ? 2.0 : tauxHS50;

  const seuilBanque = Math.max(rates.seuilBanque, rates.seuil4);

  const b0 = Math.min(H, rates.seuil1);
  const b1 = Math.max(0, Math.min(H, rates.seuil2) - rates.seuil1);
  const b2 = Math.max(0, Math.min(H, rates.seuil3) - rates.seuil2);
  const b3 = Math.max(0, Math.min(H, rates.seuil4) - rates.seuil3);
  const b4 = Math.max(0, Math.min(H, seuilBanque) - rates.seuil4); // palier 100% (ou taux cascade)
  const bBanque = Math.max(0, H - seuilBanque); // au-delà du plafond payé : versé en banque, non payé ce mois

  const payNormal = b0 * rates.tauxHoraire;
  const payEquiv = b1 * rates.tauxHoraire * 1.25;
  const payHS25 = b2 * rates.tauxHoraire * tauxHS25;
  const payHS50 = b3 * rates.tauxHoraire * tauxHS50;
  const payHS100 = b4 * rates.tauxHoraire * tauxHS100;
  const payNight = nightH * rates.tauxHoraire * 0.20; // majoration de nuit, en plus

  const salaireBaseHoraire = payNormal + payEquiv + payHS25 + payHS50 + payHS100 + payNight;
  const sommePrimes = (primesDuMois || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);

  // Brut total = base horaire + frais de route + primes (tout imposable, selon la demande)
  const salaireBrut = salaireBaseHoraire + frais + sommePrimes;

  const tauxImposition = Number(rates.tauxImposition) || 0; // en %
  const mutuelle = Number(rates.mutuelleCotisation) || 0;   // en €/mois
  const salaireNet = salaireBrut * (1 - tauxImposition / 100) - mutuelle;
  const netTotal = salaireNet; // les frais sont déjà inclus dans le brut ci-dessus
  const brutIndicatif = salaireBrut;

  return {
    H, nightH, frais, sommePrimes,
    b0, b1, b2, b3, b4, bBanque,
    tauxHS25, tauxHS50, tauxHS100,
    payNormal, payEquiv, payHS25, payHS50, payHS100, payNight,
    salaireBaseHoraire, salaireBrut, salaireNet, netTotal, brutIndicatif,
    tauxImposition, mutuelle,
  };
}

/* ---------- Périodes ---------- */

function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // lundi = 0
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}

function inPeriod(dateStr, periodType, refDate) {
  const d = new Date(dateStr + "T12:00:00");
  const ref = new Date(refDate + "T12:00:00");
  if (periodType === "jour") {
    return dateStr === refDate;
  }
  if (periodType === "semaine") {
    const s = startOfWeek(ref);
    const e = new Date(s); e.setDate(e.getDate() + 6);
    return d >= s && d <= e;
  }
  if (periodType === "mois") {
    return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
  }
  if (periodType === "annee") {
    return d.getFullYear() === ref.getFullYear();
  }
  return false;
}

/* ---------- Conformité amplitude & repos ---------- */

function classifyAmplitude(amplitudeH, rates) {
  if (amplitudeH > rates.ampliExcep) return "depassement";
  if (amplitudeH > rates.ampliBase) return "exceptionnelle";
  return "normale";
}

function longestPauseMinutes(entry) {
  return entry.pauses
    .filter((p) => p.debut && p.fin)
    .reduce((max, p) => Math.max(max, minutesBetween(p.debut, p.fin)), 0);
}

// Construit, pour une liste de journées triées, le statut de repos entre chaque
// journée et la suivante, ainsi que la classification d'amplitude de chaque jour.
function buildConformite(entries, rates, liveNow) {
  const sorted = entries
    .filter((e) => e.debutService)
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));

  return sorted.map((entry, idx) => {
    const c = computeEntry(entry, rates, liveNow);
    const amplitudeH = minutesToHours(c.amplitudeMin);
    const classe = classifyAmplitude(amplitudeH, rates);

    const next = sorted[idx + 1];
    const finRef = entry.finService || (c.enCoursService ? c.finEffective : "");
    let reposMin = null;
    let reposStatus = "inconnu";
    if (next && next.debutService && finRef) {
      reposMin = minutesBetween(finRef, next.debutService);
      const reposH = minutesToHours(reposMin);
      const longuePause = longestPauseMinutes(entry) / 60;
      if (reposH >= rates.reposNormal) reposStatus = "normal";
      else if (reposH >= rates.reposReduit && longuePause >= rates.reposCompensation) reposStatus = "fractionne";
      else reposStatus = "insuffisant";
    }

    return { date: entry.date, amplitudeH, classe, reposMin, reposStatus, enCours: c.enCoursService };
  });
}

function MonCarnetDeBord({ user, isAdmin, onLogout, joursRestantsEssai }) {
  const [tab, setTab] = useState("pointage");
  const [interstitielsMontres, setInterstitielsMontres] = useState({ paie: false, rapports: false });
  const [entries, setEntries] = useState([]);
  const [rates, setRates] = useState(DEFAULT_RATES);
  const [selectedDate, setSelectedDate] = useState(todayISODate());
  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");
  const [geoStatus, setGeoStatus] = useState("");

  const [periodType, setPeriodType] = useState("semaine");
  const [refDate, setRefDate] = useState(todayISODate());
  const [payMonth, setPayMonth] = useState(todayISODate().slice(0, 7));
  const [liveTick, setLiveTick] = useState(0);
  const [semaineConformite, setSemaineConformite] = useState(todayISODate());
  const [banque, setBanque] = useState({ soldeDepart: 0, tauxDepart: 1.5, mouvements: [] });
  const [primes, setPrimes] = useState({}); // { "2026-07": [{id, label, montant}], ... }
  const [planning, setPlanning] = useState({});
  const [statuts, setStatuts] = useState(DEFAULT_STATUTS);
  const [garage, setGarage] = useState(DEFAULT_GARAGE);
  const [categoriesEntretien, setCategoriesEntretien] = useState(DEFAULT_CATEGORIES_ENTRETIEN);
  const [categoriesDepannage, setCategoriesDepannage] = useState(DEFAULT_CATEGORIES_DEPANNAGE);
  const [carburant, setCarburant] = useState(DEFAULT_CARBURANT);
  const [theme, setTheme] = useState(DEFAULT_THEME);
  const [publicites, setPublicites] = useState(DEFAULT_PUBLICITES);
  const [pubIndex, setPubIndex] = useState(0);
  const [sansPub, setSansPub] = useState(false);
  const [niveauAbonnement, setNiveauAbonnement] = useState("gratuit"); // "gratuit" | "standard" | "premium"
  const [versionDistante, setVersionDistante] = useState({ derniereVersion: APP_VERSION, lien: LIEN_TELECHARGEMENT_APK });
  const [nouvelleVersionForm, setNouvelleVersionForm] = useState({ derniereVersion: "", lien: "" });

  // Vérifie s'il existe une version plus récente que celle installée
  const verifierMiseAJour = async () => {
    if (!firebaseConfigueValide || !db) return;
    try {
      const snap = await db.collection("config").doc("version").get();
      if (snap.exists) {
        setVersionDistante({ derniereVersion: snap.data().derniereVersion || APP_VERSION, lien: snap.data().lien || LIEN_TELECHARGEMENT_APK });
        setNouvelleVersionForm({ derniereVersion: snap.data().derniereVersion || "", lien: snap.data().lien || "" });
      }
    } catch (err) { /* pas de réseau — on garde la version connue */ }
  };
  useEffect(() => { verifierMiseAJour(); }, []);

  const publierNouvelleVersion = async () => {
    try {
      if (firebaseConfigueValide && db) {
        await db.collection("config").doc("version").set({
          derniereVersion: nouvelleVersionForm.derniereVersion || APP_VERSION,
          lien: nouvelleVersionForm.lien || LIEN_TELECHARGEMENT_APK,
        });
        setSaveStatus("Nouvelle version publiée ✓");
        verifierMiseAJour();
      }
    } catch (err) {
      setSaveStatus("Échec de la publication de version");
    }
    setTimeout(() => setSaveStatus(""), 2000);
  };

  const miseAJourDisponible = versionDistante.derniereVersion && versionDistante.derniereVersion !== APP_VERSION;

  // Charge les publicités partagées depuis Firestore (visibles par tous), avec repli sur le stockage local
  useEffect(() => {
    (async () => {
      if (firebaseConfigueValide && db) {
        try {
          const snap = await db.collection("config").doc("publicites").get();
          if (snap.exists) { setPublicites({ ...DEFAULT_PUBLICITES, ...snap.data() }); return; }
        } catch (err) { /* repli local ci-dessous */ }
      }
      try { const p = storage.get(ns("publicites")); if (p) setPublicites({ ...DEFAULT_PUBLICITES, ...p }); } catch (err) {}
    })();
  }, []);

  // Vérifie le statut publicité / niveau d'abonnement de l'utilisateur courant
  useEffect(() => {
    (async () => {
      if (!user || !db) return;
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        if (snap.exists) {
          setSansPub(!!snap.data().sansPub);
          setNiveauAbonnement(snap.data().niveauAbonnement || "gratuit");
        }
      } catch (err) { /* ignore */ }
    })();
  }, [user]);

  // Sans pub effectif : soit marqué directement, soit via le niveau d'abonnement Premium (3.99€)
  const sansPubEffectif = sansPub || niveauAbonnement === "premium";

  const [achatEnCours, setAchatEnCours] = useState(false);
  const [messageAchat, setMessageAchat] = useState("");

  // Initialise le magasin d'achats intégrés (Google Play Billing) et écoute les achats approuvés
  useEffect(() => {
    const store = window.CdvPurchase?.store;
    if (!store || !user) return;
    try {
      const { ProductType, Platform } = window.CdvPurchase;
      store.register([
        { id: PRODUIT_STANDARD_ID, type: ProductType.PAID_SUBSCRIPTION, platform: Platform.GOOGLE_PLAY },
        { id: PRODUIT_PREMIUM_ID, type: ProductType.PAID_SUBSCRIPTION, platform: Platform.GOOGLE_PLAY },
      ]);
      store.when().approved(async (transaction) => {
        try {
          const purchaseToken = transaction.nativePurchase?.purchaseToken || transaction.purchaseId;
          const productId = transaction.products?.[0]?.id;
          if (functionsFirebase && purchaseToken && productId) {
            setMessageAchat("Vérification de l'achat en cours…");
            const verifier = functionsFirebase.httpsCallable("verifierAbonnementGooglePlay");
            const res = await verifier({ productId, purchaseToken });
            if (res.data?.success) {
              setNiveauAbonnement(res.data.niveau);
              setMessageAchat("Abonnement activé ✓");
              await transaction.finish();
            }
          }
        } catch (err) {
          setMessageAchat("Échec de la vérification de l'achat auprès du serveur.");
        }
        setAchatEnCours(false);
        setTimeout(() => setMessageAchat(""), 4000);
      });
      store.initialize([Platform.GOOGLE_PLAY]);
    } catch (err) { /* Billing non disponible (ex: aperçu web) — ignoré silencieusement */ }
  }, [user]);

  const acheterAbonnement = (productId) => {
    const store = window.CdvPurchase?.store;
    if (!store) { setMessageAchat("Achat disponible uniquement depuis l'application installée."); setTimeout(() => setMessageAchat(""), 3000); return; }
    setAchatEnCours(true);
    const produit = store.get(productId);
    if (produit && produit.getOffer()) {
      produit.getOffer().order();
    } else {
      setAchatEnCours(false);
      setMessageAchat("Offre indisponible pour le moment.");
      setTimeout(() => setMessageAchat(""), 3000);
    }
  };


  const enregistrerPublicitesPartagees = async () => {
    try {
      if (firebaseConfigueValide && db) {
        await db.collection("config").doc("publicites").set(publicites);
        setSaveStatus("Publicités publiées ✓");
      } else {
        setSaveStatus("Firebase non configuré — sauvegarde locale uniquement");
      }
    } catch (err) {
      setSaveStatus("Échec de la publication");
    }
    setTimeout(() => setSaveStatus(""), 2000);
  };
  const [planningMois, setPlanningMois] = useState(todayISODate().slice(0, 7));

  // Rafraîchit l'affichage toutes les 30 secondes pour que l'amplitude,
  // le temps de service et la pause en cours avancent automatiquement.
  useEffect(() => {
    const interval = setInterval(() => setLiveTick((t) => t + 1), 30000);
    return () => clearInterval(interval);
  }, []);

  /* ---------- Espace de stockage propre à l'utilisateur connecté ---------- */
  const ns = (key) => `carnet-${user?.uid || "local"}-${key}`;

  /* ---------- Google AdMob (bannière permanente + interstitiels) — selon niveau d'abonnement :
     Gratuit  : bannière + vidéo (interstitiel) à l'ouverture des onglets Frais, Rapports et Paie
     1,99 €   : bannière + vidéo (interstitiel) uniquement à l'ouverture de l'onglet Paie
     3,99 €   : aucune publicité ---------- */
  useEffect(() => {
    const AdMobPlugin = window.Capacitor?.Plugins?.AdMob;
    if (!AdMobPlugin || sansPubEffectif) return; // Premium ou "sans pub" : on n'initialise même pas AdMob
    (async () => {
      try {
        await AdMobPlugin.initialize({ initializeForTesting: false });
        await AdMobPlugin.showBanner({
          adId: ADMOB_BANNIERE_ID,
          adSize: "ADAPTIVE_BANNER",
          position: "BOTTOM_CENTER",
          margin: 0,
        });
        await AdMobPlugin.prepareInterstitial({ adId: ADMOB_INTERSTITIEL_DEMARRAGE_ID });
        await AdMobPlugin.showInterstitial();
      } catch (err) { /* AdMob indisponible ou pub non chargée — on ignore, l'app continue normalement */ }
    })();
  }, [sansPubEffectif]);

  const afficherInterstitiel = async (adId) => {
    if (sansPubEffectif) return;
    const AdMobPlugin = window.Capacitor?.Plugins?.AdMob;
    if (!AdMobPlugin) return;
    try {
      await AdMobPlugin.prepareInterstitial({ adId });
      await AdMobPlugin.showInterstitial();
    } catch (err) { /* pub non disponible — on ignore */ }
  };

  const changerOnglet = (id) => {
    setTab(id);
    if (sansPubEffectif) return; // Premium (3.99€) : jamais d'interstitiel
    if (id === "paie" && !interstitielsMontres.paie) {
      setInterstitielsMontres((p) => ({ ...p, paie: true }));
      afficherInterstitiel(ADMOB_INTERSTITIEL_PAIE_ID);
    }
    // L'interstitiel Frais/Rapports n'est montré qu'au niveau Gratuit — pas au niveau 1,99€
    if (niveauAbonnement === "gratuit" && (id === "rapports" || id === "frais") && !interstitielsMontres.rapports) {
      setInterstitielsMontres((p) => ({ ...p, rapports: true }));
      afficherInterstitiel(ADMOB_INTERSTITIEL_RAPPORTS_ID);
    }
  };

  /* ---------- Chargement initial (cloud en priorité si connecté, sinon local) ---------- */
  useEffect(() => {
    (async () => {
      let donneesCloud = null;
      if (user && firebaseConfigueValide && db) {
        try {
          const snap = await db.collection("users").doc(user.uid).get();
          if (snap.exists && snap.data().carnetData) {
            donneesCloud = JSON.parse(snap.data().carnetData);
          }
        } catch (err) { /* pas de réseau ou pas de données cloud — repli local ci-dessous */ }
      }
      const lire = (cle, defaut) => {
        if (donneesCloud && donneesCloud[cle] !== undefined) return donneesCloud[cle];
        try { const v = storage.get(ns(cle.replace(/([A-Z])/g, "-$1").toLowerCase())); return v ?? defaut; } catch (err) { return defaut; }
      };
      setEntries(lire("entries", []));
      setRates({ ...DEFAULT_RATES, ...lire("rates", {}) });
      setBanque(lire("banque", { soldeDepart: 0, tauxDepart: 1.5, mouvements: [] }));
      setPrimes(lire("primes", {}));
      setPlanning(lire("planning", {}));
      setStatuts(lire("statuts", DEFAULT_STATUTS));
      setGarage({ ...DEFAULT_GARAGE, ...lire("garage", {}) });
      setCategoriesEntretien(lire("categoriesEntretien", DEFAULT_CATEGORIES_ENTRETIEN));
      setCategoriesDepannage(lire("categoriesDepannage", DEFAULT_CATEGORIES_DEPANNAGE));
      setCarburant(lire("carburant", DEFAULT_CARBURANT));
      setTheme({ ...DEFAULT_THEME, ...lire("theme", {}) });
      setLoaded(true);
    })();
  }, [user]);

  /* ---------- Sauvegarde (locale + cloud si connecté) ---------- */
  const saveAll = useCallback(async (nextEntries, nextRates) => {
    const donnees = {
      entries: nextEntries ?? entries, rates: nextRates ?? rates, banque, primes, planning, statuts, garage,
      categoriesEntretien, categoriesDepannage, carburant, theme,
    };
    try {
      storage.set(ns("entries"), donnees.entries);
      storage.set(ns("rates"), donnees.rates);
      storage.set(ns("banque"), banque);
      storage.set(ns("primes"), primes);
      storage.set(ns("planning"), planning);
      storage.set(ns("statuts"), statuts);
      storage.set(ns("garage"), garage);
      storage.set(ns("categories-entretien"), categoriesEntretien);
      storage.set(ns("categories-depannage"), categoriesDepannage);
      storage.set(ns("carburant"), carburant);
      storage.set(ns("theme"), theme);
      storage.set(ns("publicites"), publicites);

      if (user && firebaseConfigueValide && db) {
        try {
          await db.collection("users").doc(user.uid).set({ carnetData: JSON.stringify(donnees) }, { merge: true });
          setSaveStatus("Synchronisé ✓");
        } catch (err) {
          setSaveStatus("Enregistré localement (pas de réseau)");
        }
      } else {
        setSaveStatus("Enregistré ✓");
      }
      setTimeout(() => setSaveStatus(""), 1800);
    } catch (err) {
      setSaveStatus("Échec de l'enregistrement");
      setTimeout(() => setSaveStatus(""), 2500);
    }
  }, [entries, rates, banque, primes, planning, statuts, garage, categoriesEntretien, categoriesDepannage, carburant, theme, publicites, user]);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => { saveAll(); }, 700);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [entries, rates, banque, primes, planning, statuts, garage, categoriesEntretien, categoriesDepannage, carburant, theme, publicites, loaded]);

  useEffect(() => {
    const annonces = publicites.annonces || [];
    if (!publicites.actif || annonces.length <= 1) return;
    const intervalMs = Math.max(5, Number(publicites.intervalleSecondes) || 60) * 1000;
    const id = setInterval(() => { setPubIndex((i) => (i + 1) % annonces.length); }, intervalMs);
    return () => clearInterval(id);
  }, [publicites.actif, publicites.intervalleSecondes, publicites.annonces?.length]);

  /* ---------- Gestion de l'entrée du jour sélectionné ---------- */

  const currentEntry = useMemo(() => {
    return entries.find((e) => e.date === selectedDate) || emptyEntry(selectedDate);
  }, [entries, selectedDate]);

  const updateEntry = useCallback((patch) => {
    setEntries((prev) => {
      const exists = prev.some((e) => e.date === selectedDate);
      if (!exists) {
        return [...prev, { ...emptyEntry(selectedDate), ...patch }];
      }
      return prev.map((e) => (e.date === selectedDate ? { ...e, ...patch } : e));
    });
  }, [selectedDate]);

  const deleteCurrentEntry = () => {
    if (!window.confirm("Supprimer la journée du " + selectedDate + " ?")) return;
    setEntries((prev) => prev.filter((e) => e.date !== selectedDate));
  };

  const calc = useMemo(() => computeEntry(currentEntry, rates, nowLocalISO()), [currentEntry, rates, liveTick]);
  const routier = useMemo(() => computeModeRoutier(currentEntry, rates, nowLocalISO(), calc.serviceMin, calc.pauseMin), [currentEntry, rates, calc.serviceMin, calc.pauseMin, liveTick]);

  // Coupure de repos : temps écoulé entre la fin de service de la veille (ou du dernier jour travaillé)
  // et le début de service du jour sélectionné (ou l'instant présent si le service n'a pas encore commencé).
  const coupure = useMemo(() => {
    const entreesTriees = entries.filter((e) => e.finService && e.date < selectedDate).sort((a, b) => b.date.localeCompare(a.date));
    const derniereEntreeAvecFin = entreesTriees[0];
    if (!derniereEntreeAvecFin) return null;
    const finPrecedente = new Date(derniereEntreeAvecFin.finService);
    const debutSuivant = currentEntry.debutService ? new Date(currentEntry.debutService) : new Date(nowLocalISO());
    const dureeMin = (debutSuivant - finPrecedente) / 60000;
    if (dureeMin < 0) return null;
    const estWeekend = [0, 6].includes(finPrecedente.getDay()) || [0, 6].includes(debutSuivant.getDay());
    return { dureeMin, depuisDate: derniereEntreeAvecFin.date, enCours: !currentEntry.debutService, estWeekend };
  }, [entries, selectedDate, currentEntry.debutService, liveTick]);

  /* ---------- Actions de pointage ---------- */

  const debuterService = () => updateEntry({ debutService: nowLocalISO() });
  const terminerService = () => updateEntry({ finService: nowLocalISO() });

  const debuterPause = () => {
    const pauses = [...currentEntry.pauses];
    if (pauses.length && !pauses[pauses.length - 1].fin) return; // pause déjà en cours
    pauses.push({ debut: nowLocalISO(), fin: "" });
    updateEntry({ pauses });
  };
  const terminerPause = () => {
    const pauses = [...currentEntry.pauses];
    const idx = pauses.length - 1;
    if (idx < 0 || pauses[idx].fin) return;
    pauses[idx] = { ...pauses[idx], fin: nowLocalISO() };
    updateEntry({ pauses });
  };
  const pauseEnCours = currentEntry.pauses.length > 0 && !currentEntry.pauses[currentEntry.pauses.length - 1].fin;

  const updatePause = (idx, field, val) => {
    const pauses = [...currentEntry.pauses];
    pauses[idx] = { ...pauses[idx], [field]: val };
    updateEntry({ pauses });
  };
  const removePause = (idx) => {
    const pauses = currentEntry.pauses.filter((_, i) => i !== idx);
    updateEntry({ pauses });
  };

  /* ---------- Géolocalisation ---------- */

  const geolocaliser = async (target) => {
    setGeoStatus("Localisation en cours…");
    try {
      let latitude, longitude;
      const CapGeo = window.Capacitor?.Plugins?.Geolocation;
      if (CapGeo) {
        // Plugin natif Capacitor — gère lui-même la demande de permission Android
        const pos = await CapGeo.getCurrentPosition({ enableHighAccuracy: true, timeout: 10000 });
        latitude = pos.coords.latitude; longitude = pos.coords.longitude;
      } else if (navigator.geolocation) {
        // Repli navigateur (utile en mode web/PWA hors app native)
        const pos = await new Promise((resolve, reject) =>
          navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 })
        );
        latitude = pos.coords.latitude; longitude = pos.coords.longitude;
      } else {
        setGeoStatus("Géolocalisation non disponible sur cet appareil.");
        return;
      }
      updateEntry({ [target]: { ...currentEntry[target], lat: latitude, lon: longitude } });
      setGeoStatus("Position enregistrée ✓ — recherche de l'adresse…");
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
        const data = await res.json();
        if (data?.display_name) {
          updateEntry({ [target]: { ...currentEntry[target], lat: latitude, lon: longitude, adresse: data.display_name } });
        }
      } catch (e) { /* adresse indisponible, coordonnées déjà enregistrées */ }
      setGeoStatus("Position enregistrée ✓");
      setTimeout(() => setGeoStatus(""), 2500);
    } catch (err) {
      setGeoStatus("Position refusée ou indisponible. Vous pouvez saisir le lieu manuellement.");
      setTimeout(() => setGeoStatus(""), 3500);
    }
  };

  /* ---------- Conformité amplitude & repos ---------- */

  const semaineDebut = useMemo(() => startOfWeek(new Date(semaineConformite + "T12:00:00")), [semaineConformite]);
  const semaineFin = useMemo(() => { const f = new Date(semaineDebut); f.setDate(f.getDate() + 6); return f; }, [semaineDebut]);

  const entriesSemaineConformite = useMemo(() => {
    return entries.filter((e) => {
      const d = new Date(e.date + "T12:00:00");
      return d >= semaineDebut && d <= semaineFin;
    });
  }, [entries, semaineDebut, semaineFin]);

  const conformiteSemaine = useMemo(
    () => buildConformite(entriesSemaineConformite, rates, nowLocalISO()),
    [entriesSemaineConformite, rates, liveTick]
  );

  const exceptionsUtilisees = useMemo(
    () => conformiteSemaine.filter((j) => j.classe === "exceptionnelle").length,
    [conformiteSemaine]
  );

  /* ---------- Rapports ---------- */

  const entriesInPeriod = useMemo(
    () => entries.filter((e) => inPeriod(e.date, periodType, refDate)).sort((a, b) => a.date.localeCompare(b.date)),
    [entries, periodType, refDate]
  );

  const periodTotals = useMemo(() => {
    let serviceMin = 0, nightMin = 0, frais = 0, amplitudeMin = 0;
    const liveNowStr = nowLocalISO();
    entriesInPeriod.forEach((e) => {
      const c = computeEntry(e, rates, liveNowStr);
      serviceMin += c.serviceMin;
      nightMin += c.nightWorkedMin;
      frais += c.frais;
      amplitudeMin += c.amplitudeMin;
    });
    return { serviceMin, nightMin, frais, amplitudeMin };
  }, [entriesInPeriod, rates, liveTick]);

  const supprimerPeriode = () => {
    if (!window.confirm(`Supprimer les ${entriesInPeriod.length} journée(s) de cette période ?`)) return;
    const idsToRemove = new Set(entriesInPeriod.map((e) => e.id));
    setEntries((prev) => prev.filter((e) => !idsToRemove.has(e.id)));
  };

  const envoyerRapportEmail = () => {
    const label = { jour: "Jour", semaine: "Semaine", mois: "Mois", annee: "Année" }[periodType];
    const subject = `Carnet de bord — Rapport (${label}) — ${refDate}`;
    let body = `Rapport ${label} — référence ${refDate}\n\n`;
    body += `Temps de service total : ${fmtHM(periodTotals.serviceMin)}\n`;
    body += `Amplitude totale : ${fmtHM(periodTotals.amplitudeMin)}\n`;
    body += `Heures de nuit : ${fmtHM(periodTotals.nightMin)}\n`;
    body += `Frais de route : ${periodTotals.frais.toFixed(2)} €\n\n`;
    body += `Détail par journée :\n`;
    const liveNowStr = nowLocalISO();
    entriesInPeriod.forEach((e) => {
      const c = computeEntry(e, rates, liveNowStr);
      body += `- ${e.date} : service ${fmtHM(c.serviceMin)}, nuit ${fmtHM(c.nightWorkedMin)}, frais ${c.frais.toFixed(2)} €\n`;
    });
    body += `\nMon carnet de bord — Yoda 0.1 — FARDOUX Mathieu`;
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  };

  const genererRapportPDF = async () => {
    const jsPDFLib = window.jspdf?.jsPDF;
    if (!jsPDFLib) { setSaveStatus("Génération PDF indisponible (pas de réseau au premier chargement)"); setTimeout(() => setSaveStatus(""), 3000); return; }

    const label = { jour: "Jour", semaine: "Semaine", mois: "Mois", annee: "Année" }[periodType];
    const doc = new jsPDFLib({ unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const NAVY = [15, 23, 42], AMBER = [245, 158, 11], SLATE = [71, 85, 105], LIGHT = [241, 245, 249];

    // En-tête
    doc.setFillColor(...NAVY); doc.rect(0, 0, pageW, 28, "F");
    doc.setTextColor(...AMBER); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text("MON CARNET DE BORD", 14, 13);
    doc.setTextColor(220, 220, 230); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text("Yoda 0.1 — FARDOUX Mathieu", 14, 20);
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
    doc.text(`Rapport — ${label}`, pageW - 14, 13, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(200, 200, 210);
    doc.text(`Référence : ${refDate}`, pageW - 14, 20, { align: "right" });

    // Bloc résumé
    let y = 38;
    doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    doc.text("Résumé de la période", 14, y);
    y += 6;
    const resume = [
      ["Temps de service total", fmtHM(periodTotals.serviceMin)],
      ["Amplitude totale", fmtHM(periodTotals.amplitudeMin)],
      ["Heures de nuit (majorées 20%)", fmtHM(periodTotals.nightMin)],
      ["Frais de route totaux", `${periodTotals.frais.toFixed(2)} €`],
      ["Nombre de journées travaillées", String(entriesInPeriod.length)],
    ];
    doc.autoTable({
      startY: y, theme: "plain", styles: { fontSize: 10, textColor: NAVY },
      columnStyles: { 0: { textColor: SLATE }, 1: { fontStyle: "bold", halign: "right" } },
      body: resume, margin: { left: 14, right: 14 },
    });

    // Tableau détaillé
    y = doc.lastAutoTable.finalY + 10;
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...NAVY);
    doc.text("Détail journalier", 14, y);

    const liveNowStr = nowLocalISO();
    const lignes = entriesInPeriod.map((e) => {
      const c = computeEntry(e, rates, liveNowStr);
      return [
        e.date, e.debutService ? e.debutService.slice(11, 16) : "—", e.finService ? e.finService.slice(11, 16) : "—",
        fmtHM(c.amplitudeMin), fmtHM(c.pauseMin), fmtHM(c.serviceMin), fmtHM(c.nightWorkedMin), `${c.frais.toFixed(2)} €`,
      ];
    });
    doc.autoTable({
      startY: y + 4,
      head: [["Date", "Début", "Fin", "Amplitude", "Pause", "Service", "Nuit", "Frais"]],
      body: lignes,
      theme: "striped",
      headStyles: { fillColor: NAVY, textColor: 255, fontStyle: "bold", fontSize: 9 },
      bodyStyles: { fontSize: 8.5, textColor: [30, 41, 59] },
      alternateRowStyles: { fillColor: LIGHT },
      margin: { left: 14, right: 14 },
      didDrawPage: (data) => {
        const pageH = doc.internal.pageSize.getHeight();
        doc.setFontSize(8); doc.setTextColor(...SLATE);
        doc.text("Mon carnet de bord — Yoda 0.1 — FARDOUX Mathieu", 14, pageH - 8);
        doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageW - 14, pageH - 8, { align: "right" });
      },
    });

    const nomFichier = `rapport-${periodType}-${refDate}.pdf`;

    try {
      const CapFS = window.Capacitor?.Plugins?.Filesystem;
      const CapShare = window.Capacitor?.Plugins?.Share;
      if (CapFS && CapShare) {
        const base64 = doc.output("datauristring").split(",")[1];
        const res = await CapFS.writeFile({ path: nomFichier, data: base64, directory: "DOCUMENTS" });
        await CapShare.share({ title: "Rapport Mon carnet de bord", url: res.uri, dialogTitle: "Partager le rapport" });
        setSaveStatus("Rapport PDF partagé ✓");
      } else {
        doc.save(nomFichier); // repli navigateur : téléchargement direct
        setSaveStatus("Rapport PDF téléchargé ✓");
      }
    } catch (err) {
      setSaveStatus("Échec de la génération du rapport PDF");
    }
    setTimeout(() => setSaveStatus(""), 2500);
  };

  /* ---------- Paie mensuelle ---------- */

  const entriesInMonth = useMemo(
    () => entries.filter((e) => e.date.slice(0, 7) === payMonth),
    [entries, payMonth]
  );
  const primesDuMois = primes[payMonth] || [];
  const pay = useMemo(() => computeMonthPay(entriesInMonth, rates, nowLocalISO(), primesDuMois), [entriesInMonth, rates, primesDuMois, liveTick]);

  const ajouterPrime = (label, montant) => {
    if (!label || !montant) return;
    setPrimes((prev) => ({
      ...prev,
      [payMonth]: [...(prev[payMonth] || []), { id: "prime-" + Math.random().toString(36).slice(2, 8), label, montant }],
    }));
  };
  const supprimerPrime = (id) => {
    setPrimes((prev) => ({ ...prev, [payMonth]: (prev[payMonth] || []).filter((p) => p.id !== id) }));
  };

  const envoyerPaieEmail = () => {
    const subject = `Carnet de bord — Estimation de paie — ${payMonth}`;
    let body = `Estimation de paie — ${payMonth}\n\n`;
    body += `Heures totales : ${pay.H.toFixed(2)} h (dont nuit ${pay.nightH.toFixed(2)} h)\n\n`;
    body += `Base 0-${rates.seuil1}h  : ${pay.b0.toFixed(2)} h × ${rates.tauxHoraire}€           = ${pay.payNormal.toFixed(2)} €\n`;
    body += `Équiv. 25% (${rates.seuil1}-${rates.seuil2}h) : ${pay.b1.toFixed(2)} h × ${(rates.tauxHoraire * 1.25).toFixed(2)}€ = ${pay.payEquiv.toFixed(2)} €\n`;
    body += `HS 25% (${rates.seuil2}-${rates.seuil3}h)     : ${pay.b2.toFixed(2)} h × ${(rates.tauxHoraire * pay.tauxHS25).toFixed(2)}€ = ${pay.payHS25.toFixed(2)} €\n`;
    body += `HS 50% (${rates.seuil3}-${rates.seuil4}h)     : ${pay.b3.toFixed(2)} h × ${(rates.tauxHoraire * pay.tauxHS50).toFixed(2)}€ = ${pay.payHS50.toFixed(2)} €\n`;
    body += `HS 100% (${rates.seuil4}-${rates.seuilBanque}h) : ${pay.b4.toFixed(2)} h × ${(rates.tauxHoraire * pay.tauxHS100).toFixed(2)}€ = ${pay.payHS100.toFixed(2)} €\n`;
    body += `Majoration de nuit (20%)     : ${pay.payNight.toFixed(2)} €\n\n`;
    if (pay.bBanque > 0) {
      body += `Versé en banque d'heures (au-delà de ${rates.seuilBanque}h, non payé ce mois) : ${pay.bBanque.toFixed(2)} h à ${(pay.tauxHS100 * 100).toFixed(0)}%\n\n`;
    }
    body += `Salaire brut estimé : ${pay.salaireBrut.toFixed(2)} €\n`;
    body += `Salaire net estimé  : ${pay.salaireNet.toFixed(2)} €\n`;
    body += `Frais de route      : ${pay.frais.toFixed(2)} €\n`;
    body += `TOTAL NET ESTIMÉ    : ${pay.netTotal.toFixed(2)} €\n\n`;
    body += `Mon carnet de bord — Yoda 0.1 — FARDOUX Mathieu`;
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  };

  /* ---------- Banque d'heures ---------- */

  const soldeBanqueHeures = useMemo(() => {
    const depots = banque.mouvements.filter((m) => m.type === "depot").reduce((s, m) => s + Number(m.heures), 0);
    const retraits = banque.mouvements.filter((m) => m.type === "retrait").reduce((s, m) => s + Number(m.heures), 0);
    return Number(banque.soldeDepart || 0) + depots - retraits;
  }, [banque]);

  const soldeBanqueValeur = useMemo(() => {
    let total = Number(banque.soldeDepart || 0) * Number(banque.tauxDepart || 1) * rates.tauxHoraire;
    banque.mouvements.forEach((m) => {
      const signe = m.type === "depot" ? 1 : -1;
      total += signe * Number(m.heures) * Number(m.taux || 1) * rates.tauxHoraire;
    });
    return total;
  }, [banque, rates.tauxHoraire]);

  const dejaVerseCeMois = banque.mouvements.some((m) => m.type === "depot" && m.note === `Versement automatique ${payMonth}`);

  const verserBanqueDuMois = () => {
    if (pay.bBanque <= 0 || dejaVerseCeMois) return;
    const mouvement = {
      id: "mvt-" + Math.random().toString(36).slice(2, 9),
      date: todayISODate(),
      type: "depot",
      heures: Number(pay.bBanque.toFixed(2)),
      taux: pay.tauxHS100,
      note: `Versement automatique ${payMonth}`,
    };
    setBanque((prev) => ({ ...prev, mouvements: [...prev.mouvements, mouvement] }));
  };

  const ajouterMouvementBanque = (type, heures, taux, note) => {
    if (!heures || Number(heures) <= 0) return;
    const mouvement = {
      id: "mvt-" + Math.random().toString(36).slice(2, 9),
      date: todayISODate(),
      type,
      heures: Number(heures),
      taux: Number(taux) || 1,
      note: note || (type === "depot" ? "Dépôt manuel" : "Retrait manuel"),
    };
    setBanque((prev) => ({ ...prev, mouvements: [...prev.mouvements, mouvement] }));
  };

  const supprimerMouvementBanque = (id) => {
    setBanque((prev) => ({ ...prev, mouvements: prev.mouvements.filter((m) => m.id !== id) }));
  };

  /* ---------- Planning (statuts jour) ---------- */

  const definirStatutJour = (date, statut) => {
    setPlanning((prev) => {
      const next = { ...prev };
      if (!statut) delete next[date];
      else next[date] = statut;
      return next;
    });
  };

  const joursDuMoisPlanning = useMemo(() => {
    const [an, mois] = planningMois.split("-").map(Number);
    const nbJours = new Date(an, mois, 0).getDate();
    return Array.from({ length: nbJours }, (_, i) => {
      const jour = String(i + 1).padStart(2, "0");
      const date = `${planningMois}-${jour}`;
      const aTravaille = entries.some((e) => e.date === date && e.debutService);
      return { date, statut: planning[date] || (aTravaille ? "poste" : ""), aTravaille };
    });
  }, [planningMois, planning, entries]);

  const modifierStatut = (id, patch) => setStatuts((prev) => prev.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  const supprimerStatut = (id) => setStatuts((prev) => prev.filter((s) => s.id !== id));
  const ajouterStatut = () => {
    const id = "statut-" + Math.random().toString(36).slice(2, 8);
    setStatuts((prev) => [...prev, { id, label: "Nouvelle catégorie", couleur: "#64748b" }]);
  };

  /* ---------- Garage ---------- */

  const updateGarageVehicule = (vehicule, field, value) =>
    setGarage((prev) => ({ ...prev, [vehicule]: { ...prev[vehicule], [field]: value } }));

  const ajouterEntretien = (entretien) =>
    setGarage((prev) => ({ ...prev, entretiens: [...prev.entretiens, { id: "ent-" + Math.random().toString(36).slice(2, 8), ...entretien }] }));
  const supprimerEntretien = (id) =>
    setGarage((prev) => ({ ...prev, entretiens: prev.entretiens.filter((e) => e.id !== id) }));

  const ajouterDepannage = (depannage) =>
    setGarage((prev) => ({ ...prev, depannages: [...prev.depannages, { id: "dep-" + Math.random().toString(36).slice(2, 8), ...depannage }] }));
  const supprimerDepannage = (id) =>
    setGarage((prev) => ({ ...prev, depannages: prev.depannages.filter((d) => d.id !== id) }));

  const ajouterCategorieEntretien = (nom) => {
    if (!nom || categoriesEntretien.includes(nom)) return;
    setCategoriesEntretien((prev) => [...prev.filter((c) => c !== "Autre"), nom, "Autre"]);
  };
  const supprimerCategorieEntretien = (nom) => setCategoriesEntretien((prev) => prev.filter((c) => c !== nom));
  const ajouterCategorieDepannage = (nom) => {
    if (!nom || categoriesDepannage.includes(nom)) return;
    setCategoriesDepannage((prev) => [...prev.filter((c) => c !== "Autre"), nom, "Autre"]);
  };
  const supprimerCategorieDepannage = (nom) => setCategoriesDepannage((prev) => prev.filter((c) => c !== nom));

  /* ---------- Carburant ---------- */

  const ajouterPlein = (plein) =>
    setCarburant((prev) => ({ ...prev, pleins: [...prev.pleins, { id: "plein-" + Math.random().toString(36).slice(2, 8), ...plein }] }));
  const supprimerPlein = (id) =>
    setCarburant((prev) => ({ ...prev, pleins: prev.pleins.filter((p) => p.id !== id) }));

  const consommationGasoil = useMemo(() => {
    const pleinsGasoil = carburant.pleins
      .filter((p) => p.type === "gasoil" && p.km)
      .slice()
      .sort((a, b) => Number(a.km) - Number(b.km));
    const intervalles = [];
    for (let i = 1; i < pleinsGasoil.length; i++) {
      const distKm = Number(pleinsGasoil[i].km) - Number(pleinsGasoil[i - 1].km);
      const litres = Number(pleinsGasoil[i].litres);
      if (distKm > 0) intervalles.push({ date: pleinsGasoil[i].date, distKm, litres, conso: (litres / distKm) * 100 });
    }
    const totalLitres = intervalles.reduce((s, i) => s + i.litres, 0);
    const totalKm = intervalles.reduce((s, i) => s + i.distKm, 0);
    const consoMoyenne = totalKm > 0 ? (totalLitres / totalKm) * 100 : 0;
    return { intervalles, consoMoyenne, totalKm, totalLitres };
  }, [carburant]);

  /* ---------- Réglages ---------- */
  const updateRate = (field, value) => setRates((prev) => ({ ...prev, [field]: value }));
  const updateTheme = (field, value) => setTheme((prev) => ({ ...prev, [field]: value }));

  const ajouterAnnonce = () => {
    const id = "pub-" + Math.random().toString(36).slice(2, 8);
    setPublicites((prev) => ({ ...prev, annonces: [...prev.annonces, { id, texte: "Nouvelle annonce", lien: "" }] }));
  };
  const modifierAnnonce = (id, patch) => {
    setPublicites((prev) => ({ ...prev, annonces: prev.annonces.map((a) => (a.id === id ? { ...a, ...patch } : a)) }));
  };
  const supprimerAnnonce = (id) => {
    setPublicites((prev) => ({ ...prev, annonces: prev.annonces.filter((a) => a.id !== id) }));
  };

  /* ---------- Sauvegarde / restauration des données ---------- */

  const rassemblerDonnees = () => ({
    version: 1, exporteLe: new Date().toISOString(),
    entries, rates, banque, planning, statuts, garage,
    categoriesEntretien, categoriesDepannage, carburant, theme, publicites,
  });

  const exporterDonnees = async () => {
    const donnees = JSON.stringify(rassemblerDonnees(), null, 2);
    const nomFichier = `carnet-de-bord-sauvegarde-${todayISODate()}.json`;
    try {
      const CapFS = window.Capacitor?.Plugins?.Filesystem;
      const CapShare = window.Capacitor?.Plugins?.Share;
      if (CapFS && CapShare) {
        const res = await CapFS.writeFile({ path: nomFichier, data: donnees, directory: "DOCUMENTS", encoding: "utf8" });
        await CapShare.share({ title: "Sauvegarde Mon carnet de bord", text: "Sauvegarde de mes données", url: res.uri, dialogTitle: "Envoyer la sauvegarde" });
        setSaveStatus("Sauvegarde partagée ✓");
      } else {
        // Repli navigateur : téléchargement direct du fichier
        const blob = new Blob([donnees], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = nomFichier;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setSaveStatus("Fichier téléchargé ✓");
      }
    } catch (err) {
      setSaveStatus("Échec de l'export");
    }
    setTimeout(() => setSaveStatus(""), 2500);
  };

  const importerDonnees = (fichier) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (d.entries) setEntries(d.entries);
        if (d.rates) setRates({ ...DEFAULT_RATES, ...d.rates });
        if (d.banque) setBanque(d.banque);
        if (d.planning) setPlanning(d.planning);
        if (d.statuts) setStatuts(d.statuts);
        if (d.garage) setGarage({ ...DEFAULT_GARAGE, ...d.garage });
        if (d.categoriesEntretien) setCategoriesEntretien(d.categoriesEntretien);
        if (d.categoriesDepannage) setCategoriesDepannage(d.categoriesDepannage);
        if (d.carburant) setCarburant(d.carburant);
        if (d.theme) setTheme({ ...DEFAULT_THEME, ...d.theme });
        if (d.publicites) setPublicites({ ...DEFAULT_PUBLICITES, ...d.publicites });
        setSaveStatus("Données restaurées ✓");
      } catch (err) {
        setSaveStatus("Fichier de sauvegarde invalide");
      }
      setTimeout(() => setSaveStatus(""), 2500);
    };
    reader.readAsText(fichier);
  };

  const supprimerTout = async () => {
    if (!window.confirm("Supprimer TOUTES les données du carnet de bord ? Cette action est irréversible.")) return;
    setEntries([]);
    setRates(DEFAULT_RATES);
    setBanque({ soldeDepart: 0, tauxDepart: 1.5, mouvements: [] });
    setPrimes({});
    setPlanning({});
    setStatuts(DEFAULT_STATUTS);
    setGarage(DEFAULT_GARAGE);
    setCategoriesEntretien(DEFAULT_CATEGORIES_ENTRETIEN);
    setCategoriesDepannage(DEFAULT_CATEGORIES_DEPANNAGE);
    setCarburant(DEFAULT_CARBURANT);
    setTheme(DEFAULT_THEME);
    setPublicites(DEFAULT_PUBLICITES);
    await saveAll([], DEFAULT_RATES);
  };

  const changeDay = (delta) => {
    const d = new Date(selectedDate + "T12:00:00");
    d.setDate(d.getDate() + delta);
    setSelectedDate(d.toISOString().slice(0, 10));
  };

  /* ============================= RENDU ============================= */

  const langue = (() => { try { return localStorage.getItem("carnet-langue") || "fr"; } catch (e) { return "fr"; } })();
  const t = (cle, params) => traduire(langue, cle, params);

  const TABS = [
    { id: "pointage", label: t("tabs.pointage"), icon: Clock },
    { id: "frais", label: t("tabs.frais"), icon: Euro },
    { id: "conformite", label: t("tabs.conformite"), icon: AlertCircle },
    { id: "planning", label: t("tabs.planning"), icon: Calendar },
    { id: "banque", label: t("tabs.banque"), icon: Save },
    { id: "garage", label: t("tabs.garage"), icon: Wrench },
    { id: "carburant", label: t("tabs.carburant"), icon: Fuel },
    { id: "rapports", label: t("tabs.rapports"), icon: FileText },
    { id: "paie", label: t("tabs.paie"), icon: Calendar },
    { id: "reglages", label: t("tabs.reglages"), icon: Settings },
    ...(isAdmin ? [{ id: "admin", label: t("tabs.admin"), icon: Users }] : []),
  ];

  return (
    <div
      className="min-h-screen font-sans pb-24"
      style={{ backgroundColor: theme.fond, color: theme.texte, "--accent": theme.accent, fontSize: TAILLES_TEXTE[theme.tailleTexte] || TAILLES_TEXTE.normal }}
    >
      {/* En-tête style tableau de bord */}
      <div className="border-b border-slate-800 px-4 pt-5 pb-3 sticky top-0 z-20" style={{ backgroundColor: theme.fond }}>
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-xl font-black tracking-tight" style={{ color: theme.accent }}>{t("appTitre")}</h1>
            <p className="text-[11px] text-slate-500 font-mono">
              Yoda 0.1 — FARDOUX Mathieu {user && <span className="text-slate-600">— {user.email}</span>}
            </p>
          </div>
          <div className="flex items-center gap-1.5">
            <button
              onClick={() => saveAll()}
              className="flex items-center gap-1.5 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg active:scale-95 transition"
              style={{ backgroundColor: theme.accent }}
            >
              <Save size={15} />
            </button>
            {onLogout && (
              <button onClick={onLogout} className="flex items-center gap-1.5 bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-lg active:scale-95 transition">
                <LogOut size={15} />
              </button>
            )}
          </div>
        </div>
        {saveStatus && (
          <div className="text-[11px] text-emerald-400 mt-1 flex items-center gap-1">
            <CheckCircle2 size={12} /> {saveStatus}
          </div>
        )}
        {/* Navigation onglets */}
        <div className="flex gap-1 mt-3 overflow-x-auto no-scrollbar">
          {TABS.map((t) => (
            <button
              key={t.id}
              onClick={() => changerOnglet(t.id)}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
                tab === t.id ? "text-slate-950" : "bg-slate-800/70 text-slate-400 hover:text-slate-200"
              }`}
              style={tab === t.id ? { backgroundColor: theme.accent } : undefined}
            >
              <t.icon size={14} /> {t.label}
            </button>
          ))}
        </div>
      </div>

      {joursRestantsEssai != null && (
        <div className={`text-center py-1.5 text-xs font-semibold ${joursRestantsEssai <= 5 ? "bg-rose-600 text-white" : "bg-indigo-600 text-white"}`}>
          {joursRestantsEssai > 0
            ? `Essai gratuit — ${joursRestantsEssai} jour${joursRestantsEssai > 1 ? "s" : ""} restant${joursRestantsEssai > 1 ? "s" : ""}`
            : "Essai gratuit terminé aujourd'hui"}
        </div>
      )}

      {miseAJourDisponible && (
        <a href={versionDistante.lien} target="_blank" rel="noreferrer"
          className="flex items-center justify-center gap-2 bg-emerald-600 text-white text-center py-2 text-xs font-bold">

function GeoBloc({ lieu, lat, lon, adresse, onLieu, onGeoloc, onCoordonnees }) {
  const [recherche, setRecherche] = useState("");
  const [rechercheStatus, setRechercheStatus] = useState("");

  const chercherAdresse = async () => {
    if (!recherche.trim()) return;
    setRechercheStatus("Recherche…");
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(recherche)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.length > 0) {
        onCoordonnees(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
        if (!lieu) onLieu(data[0].display_name.split(",").slice(0, 2).join(","));
        setRechercheStatus("Position trouvée ✓");
      } else {
        setRechercheStatus("Adresse introuvable.");
      }
    } catch (err) {
      setRechercheStatus("Recherche indisponible ici (réseau bloqué dans cet aperçu). Fonctionne dans l'app hébergée.");
    }
    setTimeout(() => setRechercheStatus(""), 4000);
  };

  return (
    <div className="flex flex-col gap-1.5">
      <div className="flex gap-2">
        <input
          type="text" placeholder="Nom du lieu (optionnel)"
          value={lieu} onChange={(e) => onLieu(e.target.value)}
          className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sm"
        />
        <button onClick={onGeoloc} className="flex items-center gap-1.5 bg-sky-600 rounded-lg px-3 text-xs font-semibold whitespace-nowrap"><MapPin size={14} /> Localiser moi</button>
      </div>
      <div className="flex gap-2">
        <input
          type="text" placeholder="Rechercher une adresse précise"
          value={recherche} onChange={(e) => setRecherche(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && chercherAdresse()}
          className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sm"
        />
        <button onClick={chercherAdresse} className="flex items-center gap-1 bg-indigo-600 rounded-lg px-3 text-xs font-semibold"><Search size={14} /> Chercher</button>
      </div>
      {rechercheStatus && <span className="text-[11px] text-amber-400">{rechercheStatus}</span>}
      {lat != null && lon != null && (
        <div className="flex flex-col gap-2 mt-1">
          {adresse && (
            <div className="bg-slate-800/70 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300">
              📍 {adresse}
            </div>
          )}
          <div className="rounded-lg overflow-hidden border border-slate-700" style={{ height: 180 }}>
            <iframe
              title="Carte"
              width="100%" height="100%" style={{ border: 0 }}
              src={`https://www.openstreetmap.org/export/embed.html?bbox=${lon - 0.005}%2C${lat - 0.005}%2C${lon + 0.005}%2C${lat + 0.005}&layer=mapnik&marker=${lat}%2C${lon}`}
            />
          </div>
          <a
            href={`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=16/${lat}/${lon}`}
            target="_blank" rel="noreferrer"
            className="text-[11px] text-sky-400 underline"
          >
            Ouvrir en plein écran ({lat.toFixed(4)}, {lon.toFixed(4)})
          </a>
        </div>
      )}
    </div>
  );
}

function ChampNombre({ label, value, onChange }) {
  // Champ texte (et non "number") pour accepter la virgule française
  // et un nombre illimité de décimales (ex : 12,927), sans que le
  // navigateur ne rejette ou n'arrondisse la saisie.
  const [texte, setTexte] = useState(String(value ?? "").replace(".", ","));

  const parseFR = (str) => {
    const norm = String(str).replace(/\s/g, "").replace(",", ".");
    const n = parseFloat(norm);
    return isNaN(n) ? null : n;
  };

  useEffect(() => {
    const num = parseFR(texte);
    if (num !== value) setTexte(String(value ?? "").replace(".", ","));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [value]);

  const handleChange = (e) => {
    const raw = e.target.value;
    // n'autorise que chiffres, une virgule ou un point
    if (!/^-?\d*[.,]?\d*$/.test(raw)) return;
    setTexte(raw);
    const n = parseFR(raw);
    if (n !== null) onChange(n);
  };

  return (
    <label className="flex items-center justify-between gap-2 text-xs text-slate-400">
      <span>{label}</span>
      <input
        type="text" inputMode="decimal" value={texte}
        onChange={handleChange}
        onBlur={() => setTexte(String(value ?? "").replace(".", ","))}
        className="w-24 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-sm text-slate-100 text-right"
      />
    </label>
  );
}

function EcranConnexion() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [motDePasse, setMotDePasse] = useState("");
  const [erreur, setErreur] = useState("");
  const [chargement, setChargement] = useState(false);
  const [messageReset, setMessageReset] = useState("");
  const [langue, setLangue] = useState(() => {
    try { return localStorage.getItem("carnet-langue") || "fr"; } catch (e) { return "fr"; }
  });
  const t = (cle, params) => traduire(langue, cle, params);

  const changerLangue = (code) => {
    setLangue(code);
    try { localStorage.setItem("carnet-langue", code); } catch (e) {}
  };

  const valider = async () => {
    setErreur(""); setChargement(true);
    try {
      if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(email, motDePasse);
        await db.collection("users").doc(cred.user.uid).set({
          email, createdAt: firebase.firestore.FieldValue.serverTimestamp(), freeAccess: false, locked: false,
        });
      } else {
        await auth.signInWithEmailAndPassword(email, motDePasse);
      }
    } catch (err) {
      const messages = {
        "auth/email-already-in-use": "Cette adresse e-mail a déjà un compte — connecte-toi plutôt.",
        "auth/invalid-email": "Adresse e-mail invalide.",
        "auth/weak-password": "Le mot de passe doit contenir au moins 6 caractères.",
        "auth/wrong-password": "Mot de passe incorrect.",
        "auth/user-not-found": "Aucun compte avec cette adresse e-mail.",
        "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
      };
      console.error("Erreur Firebase Auth:", err.code, err.message);
      setErreur(messages[err.code] || `Erreur (${err.code || "inconnue"}) : ${err.message || "détails indisponibles"}`);
    }
    setChargement(false);
  };

  const reinitialiserMotDePasse = async () => {
    if (!email) { setErreur("Renseigne ton e-mail ci-dessus d'abord."); return; }
    try {
      await auth.sendPasswordResetEmail(email);
      setMessageReset("E-mail de réinitialisation envoyé ✓");
    } catch (err) {
      setErreur("Impossible d'envoyer l'e-mail de réinitialisation.");
    }
  };

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
        <select value={langue} onChange={(e) => changerLangue(e.target.value)}
          className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs self-end">
          {LANGUES_DISPONIBLES.map((l) => <option key={l.code} value={l.code}>{l.label}</option>)}
        </select>

        <div className="text-center">
          <h1 className="text-xl font-black tracking-tight text-amber-400">{t("appTitre")}</h1>
          <p className="text-[11px] text-slate-500 font-mono">{t("appTagline")}</p>
        </div>

        <div className="flex gap-1 bg-slate-800/60 rounded-xl p-1">
          <button onClick={() => setMode("login")} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${mode === "login" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>{t("connexion")}</button>
          <button onClick={() => setMode("signup")} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${mode === "signup" ? "bg-amber-500 text-slate-950" : "text-slate-400"}`}>{t("creerCompte")}</button>
        </div>

        <input type="email" placeholder={t("email")} value={email} onChange={(e) => setEmail(e.target.value)}
          className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <input type="password" placeholder={t("motDePasse")} value={motDePasse} onChange={(e) => setMotDePasse(e.target.value)}
          className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />

        {erreur && <p className="text-xs text-rose-400">{erreur}</p>}
        {messageReset && <p className="text-xs text-emerald-400">{messageReset}</p>}

        <button onClick={valider} disabled={chargement || !email || !motDePasse}
          className="bg-amber-500 text-slate-950 font-bold text-sm rounded-lg py-2.5 disabled:opacity-50">
          {chargement ? t("patiente") : mode === "signup" ? t("creerMonCompte") : t("seConnecter")}
        </button>

        {mode === "login" && (
          <button onClick={reinitialiserMotDePasse} className="text-xs text-slate-400 underline">{t("motDePasseOublie")}</button>
        )}

        <p className="text-[10px] text-slate-500 text-center">
          {t("essaiGratuit", { jours: DUREE_ESSAI_JOURS_DEFAUT })}
        </p>
      </div>
    </div>
  );
}

function PanneauAdmin() {
  const [utilisateurs, setUtilisateurs] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [filtre, setFiltre] = useState("");
  const [dureeEssaiGlobale, setDureeEssaiGlobaleAdmin] = useState(DUREE_ESSAI_JOURS_DEFAUT);
  const [dureesPersonnalisees, setDureesPersonnalisees] = useState({});

  const charger = async () => {
    setChargement(true);
    try {
      const snap = await db.collection("users").get();
      setUtilisateurs(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    } catch (err) { /* erreur silencieuse */ }
    try {
      const snapConfig = await db.collection("config").doc("general").get();
      if (snapConfig.exists && snapConfig.data().dureeEssaiJours) setDureeEssaiGlobaleAdmin(Number(snapConfig.data().dureeEssaiJours));
    } catch (err) { /* erreur silencieuse */ }
    setChargement(false);
  };

  useEffect(() => { charger(); }, []);

  const toggleChamp = async (id, champ, valeur) => {
    try {
      await db.collection("users").doc(id).update({ [champ]: valeur });
      setUtilisateurs((prev) => prev.map((u) => (u.id === id ? { ...u, [champ]: valeur } : u)));
    } catch (err) { /* erreur silencieuse */ }
  };

  const publierDureeGlobale = async () => {
    try {
      await db.collection("config").doc("general").set({ dureeEssaiJours: Number(dureeEssaiGlobale) || DUREE_ESSAI_JOURS_DEFAUT }, { merge: true });
    } catch (err) { /* erreur silencieuse */ }
  };

  const enregistrerDureePersonnalisee = async (id) => {
    const valeur = dureesPersonnalisees[id];
    try {
      if (valeur === "" || valeur === undefined) {
        await db.collection("users").doc(id).update({ dureeEssaiPersonnalisee: firebase.firestore.FieldValue.delete() });
        setUtilisateurs((prev) => prev.map((u) => (u.id === id ? { ...u, dureeEssaiPersonnalisee: undefined } : u)));
      } else {
        await db.collection("users").doc(id).update({ dureeEssaiPersonnalisee: Number(valeur) });
        setUtilisateurs((prev) => prev.map((u) => (u.id === id ? { ...u, dureeEssaiPersonnalisee: Number(valeur) } : u)));
      }
    } catch (err) { /* erreur silencieuse */ }
  };

  const utilisateursFiltres = utilisateurs.filter((u) => (u.email || "").toLowerCase().includes(filtre.toLowerCase()));
  const nbGratuits = utilisateurs.filter((u) => u.freeAccess).length;
  const nbAbonnes = utilisateurs.filter((u) => u.abonnementActif).length;
  const nbStandard = utilisateurs.filter((u) => u.niveauAbonnement === "standard").length;
  const nbPremium = utilisateurs.filter((u) => u.niveauAbonnement === "premium").length;

    <div className="flex flex-col gap-3">
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col">
          <span className="text-[11px] text-slate-400">Comptes total</span>
          <span className="font-mono font-bold text-lg text-slate-100">{utilisateurs.length}</span>
        </div>
        <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col">
          <span className="text-[11px] text-slate-400">Abonnés actifs</span>
          <span className="font-mono font-bold text-lg text-emerald-400">{nbAbonnes}</span>
        </div>
        <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col">
          <span className="text-[11px] text-slate-400">1,99€ / 3,99€</span>
          <span className="font-mono font-bold text-lg text-amber-400">{nbStandard} / {nbPremium}</span>
        </div>
      </div>

      <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-col gap-2">
        <span className="text-xs uppercase tracking-wide text-slate-400">Durée d'essai globale (par défaut pour tous)</span>
        <div className="flex gap-2">

            className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sm" />
          <span className="text-xs text-slate-400 self-center">jours</span>

                  <button onClick={() => toggleChamp(u.id, "niveauAbonnement", "gratuit")}
                    className={`text-xs font-bold px-3 py-1.5 rounded-full ${(u.niveauAbonnement || "gratuit") === "gratuit" ? "bg-slate-100 text-slate-900" : "bg-slate-800 text-slate-400"}`}>
                    Gratuit — bannière + vidéo (Frais/Rapports/Paie)
                  </button>
                  <button onClick={() => toggleChamp(u.id, "niveauAbonnement", "standard")}
                    className={`text-xs font-bold px-3 py-1.5 rounded-full ${u.niveauAbonnement === "standard" ? "bg-sky-500 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                    1,99 € — bannière + vidéo (Paie uniquement)
                  </button>
                  <button onClick={() => toggleChamp(u.id, "niveauAbonnement", "premium")}
                    className={`text-xs font-bold px-3 py-1.5 rounded-full ${u.niveauAbonnement === "premium" ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                    3,99 € — aucune publicité
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <input type="number" min="1" placeholder={`Défaut : ${dureeEssaiGlobale}j`}
                  value={dureesPersonnalisees[u.id] ?? (u.dureeEssaiPersonnalisee ?? "")}
                  onChange={(e) => setDureesPersonnalisees((prev) => ({ ...prev, [u.id]: e.target.value }))}
                  className="w-28 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs" />
                <button onClick={() => enregistrerDureePersonnalisee(u.id)} className="text-xs text-slate-300 border border-slate-700 rounded-lg px-3 py-1">
                  Essai perso (jours)
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function joursDepuis(timestamp) {
  if (!timestamp) return 0;
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return (Date.now() - date.getTime()) / (1000 * 60 * 60 * 24);
}

function AuthGate() {
  const [authUser, setAuthUser] = useState(null);
  const [userDoc, setUserDoc] = useState(null);
  const [pret, setPret] = useState(false);
  const [dureeEssaiGlobale, setDureeEssaiGlobale] = useState(DUREE_ESSAI_JOURS_DEFAUT);

  useEffect(() => {
    if (!firebaseConfigueValide || !db) return;
    db.collection("config").doc("general").get()
      .then((snap) => { if (snap.exists && snap.data().dureeEssaiJours) setDureeEssaiGlobale(Number(snap.data().dureeEssaiJours)); })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (!firebaseConfigueValide) { setPret(true); return; }
    const unsubscribe = auth.onAuthStateChanged(async (u) => {
      setAuthUser(u);
      if (u) {
        try {
          const ref = db.collection("users").doc(u.uid);
          let snap = await ref.get();
          if (!snap.exists) {
            await ref.set({ email: u.email, createdAt: firebase.firestore.FieldValue.serverTimestamp(), freeAccess: false, locked: false });
            snap = await ref.get();
          }
          setUserDoc(snap.data());
        } catch (err) {
          setUserDoc({ email: u.email, createdAt: null, freeAccess: false, locked: false });
        }
      } else {
        setUserDoc(null);
      }
      setPret(true);
    });
    return () => unsubscribe();
  }, []);

  if (!firebaseConfigueValide) {
    return (
      <>
        <div className="bg-amber-500 text-slate-950 text-[11px] text-center py-1 font-semibold">
          Mode local — configuration Firebase manquante. Comptes désactivés.
        </div>
        <MonCarnetDeBord user={null} isAdmin={true} onLogout={null} />
      </>
    );
  }

  if (!pret) return <EcranMessage titre="Chargement…" message="Un instant." />;
  if (!authUser) return <EcranConnexion />;

  const isAdmin = ADMIN_EMAILS.includes(authUser.email);
  const locked = userDoc?.locked === true;
  const dureeEssaiApplicable = userDoc?.dureeEssaiPersonnalisee ?? dureeEssaiGlobale;
  const essaiEcoule = joursDepuis(userDoc?.createdAt) > dureeEssaiApplicable;
  const accesAutorise = isAdmin || userDoc?.freeAccess === true || userDoc?.abonnementActif === true || !essaiEcoule;

  const deconnexion = () => auth.signOut();

  if (locked && !isAdmin) {
    return (
      <EcranMessage
        titre="Compte verrouillé"
        message="Ton accès a été suspendu par l'administrateur. Contacte-le pour plus d'informations."
        action={<button onClick={deconnexion} className="bg-slate-800 text-slate-300 text-xs rounded-lg py-2">Se déconnecter</button>}
      />
    );
  }

  if (!accesAutorise) {
    return (
      <EcranMessage
        titre="Essai gratuit terminé"
        message={`Ta période d'essai de ${dureeEssaiApplicable} jours est terminée. Passe à l'abonnement pour continuer à utiliser l'application.`}
        action={
          <div className="flex flex-col gap-2">
            <a href={LIEN_PAIEMENT} target="_blank" rel="noreferrer" className="bg-amber-500 text-slate-950 font-bold text-sm rounded-lg py-2.5">S'abonner</a>
            <button onClick={deconnexion} className="bg-slate-800 text-slate-300 text-xs rounded-lg py-2">Se déconnecter</button>
          </div>
        }
      />
    );
  }

  const joursRestantsEssai = (!isAdmin && userDoc?.freeAccess !== true)
    ? Math.max(0, Math.ceil(dureeEssaiApplicable - joursDepuis(userDoc?.createdAt)))
    : null;

  return <MonCarnetDeBord user={authUser} isAdmin={isAdmin} onLogout={deconnexion} joursRestantsEssai={joursRestantsEssai} />;
}

const root = createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>
